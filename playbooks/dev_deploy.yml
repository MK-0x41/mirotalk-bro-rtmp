---
# ============================================================================
# Dev-Deployment der MiroTalk-BRO-RTMP-Spezialinstanz in die Vagrant-VM
# (SPEC.md Abschnitt 11). KEIN Produktions-Installer — Produktion übernimmt
# ein separater (privater) Produktions-Installer.
#
# Voraussetzungen:
#   * `vagrant up` (Root-Bootstrap-Schlüssel) und
#     `cp inventory/dev.yml.example inventory/dev.yml`.
#   * Die Arbeitskopie ist committet UND sauber: übertragen wird per
#     `git archive HEAD`, uncommittete Änderungen brechen den Pre-Flight ab.
# ============================================================================
- name: MiroTalk BRO RTMP – Dev-Deployment (Vagrant)
  hosts: all
  become: true
  gather_facts: true

  vars:
    mirotalkbro_rtp_project_dir: /opt/mirotalkbro-rtmp
    # Inventar-Variable mirotalkbro_rtmp_dev_domain gewinnt, sonst Default.
    mirotalkbro_rtp_dev_domain: >-
      {{ mirotalkbro_rtmp_dev_domain | default('mirotalkbro-rtmp-dev.test') }}
    mirotalkbro_rtp_dev_broadcast_id: devstudio
    mirotalkbro_rtp_dev_port: 3016
    # Bindungs-IP der Dev-Override-Compose-Datei (docker-compose.dev-
    # override.yml): zusätzliche Host-Bindings am privaten Vagrant-Netz, damit
    # Browser und ffmpeg vom Host aus zugreifen können (kein 0.0.0.0).
    # Inventar-Variable mirotalkbro_rtmp_dev_bind_ip gewinnt, sonst Default.
    mirotalkbro_rtp_dev_bind_ip: >-
      {{ mirotalkbro_rtmp_dev_bind_ip | default('192.168.56.5') }}
    mirotalkbro_rtp_dev_repo_root: "{{ playbook_dir }}/.."
    mirotalkbro_rtp_dev_archive_path: /tmp/opencode/mirotalkbro-rtmp-dev.tar.gz
    mirotalkbro_rtp_dev_secrets_dir: >-
      {{ mirotalkbro_rtp_project_dir }}/.secrets
    mirotalkbro_rtp_dev_certs_dir: "{{ mirotalkbro_rtp_project_dir }}/certs"
    mirotalkbro_rtp_dev_config_dir: "{{ mirotalkbro_rtp_project_dir }}/config"

  tasks:
    # --- Pre-Flight: Repository muss committet und sauber sein --------------

    - name: Git-Revision prüfen (Pre-Flight)
      ansible.builtin.command:
        argv: [git, rev-parse, --verify, HEAD]
        chdir: "{{ mirotalkbro_rtp_dev_repo_root }}"
      delegate_to: localhost
      become: false
      register: dev_git_head_check
      changed_when: false
      failed_when: false

    - name: Auf committeten Stand bestehen (Pre-Flight)
      ansible.builtin.fail:
        msg: >-
          In {{ mirotalkbro_rtp_dev_repo_root }} existiert kein gültiger
          Git-Commit (HEAD). Das Dev-Deployment überträgt den Stand per
          `git archive HEAD` und benötigt mindestens einen Commit — bitte
          zuerst committen und erneut ausführen.
      when: dev_git_head_check.rc != 0

    - name: Arbeitskopie auf sauberen Zustand prüfen (Pre-Flight)
      ansible.builtin.command:
        argv: [git, status, --porcelain]
        chdir: "{{ mirotalkbro_rtp_dev_repo_root }}"
      delegate_to: localhost
      become: false
      register: dev_git_status_check
      changed_when: false
      failed_when: false

    - name: Auf saubere Arbeitskopie bestehen (Pre-Flight)
      ansible.builtin.fail:
        msg: >-
          Die Arbeitskopie in {{ mirotalkbro_rtp_dev_repo_root }} enthält
          uncommittete Änderungen. `git archive HEAD` würde sie ignorieren
          und die VM bekäme einen veralteten Stand — bitte zuerst committen
          oder stashen. `git status --porcelain` meldet:
          {{ dev_git_status_check.stdout | default('') }}
      when: dev_git_status_check.stdout | default('') | length > 0

    # --- Docker Engine + Compose-Plugin (Dev-Variante) -----------------------
    # Orientiert an einer bewährten Docker-Install-Sequenz (docker.com-APT-Repo
    # mit Keyring), für Dev bewusst schlanker: kein UFW, kein acl und
    # keine unattended-upgrades-Konfiguration (Dev-VM ohne gehärtete
    # Basiskonfiguration).

    - name: Docker-Repository-Voraussetzungen installieren
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - openssl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: APT-Keyring-Verzeichnis anlegen
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Das Docker-APT-Repository wird ausschließlich mit dem Schlüssel aus
    # /etc/apt/keyrings/docker.asc (Signed-By) verifiziert.
    - name: Docker-APT-Signierungsschlüssel herunterladen
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Debian-Paketarchitektur ermitteln
      ansible.builtin.command:
        argv: [dpkg, --print-architecture]
      register: dev_deb_architecture
      changed_when: false

    - name: Docker-APT-Repository konfigurieren
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Architectures: {{ dev_deb_architecture.stdout }}
          Signed-By: /etc/apt/keyrings/docker.asc
      register: dev_docker_repo_state

    # Nach Anlage/Änderung des Repos den Paketindex unabhängig vom Cache-Alter
    # neu laden (cache_valid_time: 0), sonst findet apt docker-ce
    # deterministisch nicht ("No package ... available").
    - name: Docker-Pakete installieren
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        # 0 = Index-Refresh erzwingen (Repo neu/geändert), sonst 3600.
        cache_valid_time: >-
          {{ 0 if dev_docker_repo_state is changed else 3600 }}

    - name: Docker aktivieren und starten
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Docker-Compose-Plugin verifizieren
      ansible.builtin.command:
        argv: [docker, compose, version]
      changed_when: false

    # --- Projektverzeichnis ---------------------------------------------------

    - name: Projektverzeichnis anlegen
      ansible.builtin.file:
        path: "{{ mirotalkbro_rtp_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # --- Repositoryübertragung per git archive -------------------------------

    - name: Repository als Tarball auf die VM übertragen
      block:
        - name: Lokalen Temp-Katalog für das Git-Archiv sicherstellen
          ansible.builtin.file:
            path: "{{ mirotalkbro_rtp_dev_archive_path | dirname }}"
            state: directory
            mode: "0755"
          delegate_to: localhost
          become: false

        - name: Git-Archiv erzeugen
          ansible.builtin.command:
            argv:
              - git
              - archive
              - --format=tar.gz
              - -o
              - "{{ mirotalkbro_rtp_dev_archive_path }}"
              - HEAD
            chdir: "{{ mirotalkbro_rtp_dev_repo_root }}"
          delegate_to: localhost
          become: false
          changed_when: false

        # Vor dem Entpacken alle Toplevel-Einträge außer .secrets/ räumen,
        # damit im Git gelöschte Dateien kein Re-Deploy überleben. Reihenfolge
        # (räumen → entpacken → rendern) ist wesentlich: Die Render-Artefakte
        # (.env, certs/tls.*, config/keys.json) werden NACH dem Räumen neu
        # erzeugt — keys.json und .env bedingungslos per Template, das
        # Zertifikat über seinen creates-Guard (nach dem Räumen erneut
        # angelegt; akzeptables Dev-Verhalten). Secrets überleben in .secrets.
        - name: Projektverzeichnis räumen (alles außer .secrets)
          ansible.builtin.command:
            argv:
              - find
              - "{{ mirotalkbro_rtp_project_dir }}"
              - -mindepth
              - "1"
              - -maxdepth
              - "1"
              - "!"
              - -name
              - .secrets
              - -print
              - -exec
              - rm
              - -rf
              - "{}"
              - "+"
          register: dev_project_wipe
          changed_when: dev_project_wipe.stdout | length > 0

        - name: Tarball auf die VM kopieren
          ansible.builtin.copy:
            src: "{{ mirotalkbro_rtp_dev_archive_path }}"
            dest: "{{ mirotalkbro_rtp_project_dir }}/"
            owner: root
            group: root
            mode: "0644"

        - name: Tarball im Projektverzeichnis entpacken
          ansible.builtin.unarchive:
            src: >-
              {{ mirotalkbro_rtp_project_dir }}/{{
              mirotalkbro_rtp_dev_archive_path | basename }}
            dest: "{{ mirotalkbro_rtp_project_dir }}"
            remote_src: true
            owner: root
            group: root

      always:
        - name: Lokalen Tarball entfernen
          ansible.builtin.file:
            path: "{{ mirotalkbro_rtp_dev_archive_path }}"
            state: absent
          delegate_to: localhost
          become: false

        - name: Tarball auf der VM entfernen
          ansible.builtin.file:
            path: >-
              {{ mirotalkbro_rtp_project_dir }}/{{
              mirotalkbro_rtp_dev_archive_path | basename }}
            state: absent

    # --- Verzeichnisse für Zertifikat, Keys und Secrets ----------------------
    # Explizit anlegen: die Verzeichnisse certs/ und config/ sind im Archiv
    # nur mit ihren getrackten Platzhaltern vorhanden.

    - name: Zertifikats- und Konfigurationsverzeichnisse anlegen
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ mirotalkbro_rtp_dev_certs_dir }}"
        - "{{ mirotalkbro_rtp_dev_config_dir }}"

    - name: Secret-Verzeichnis anlegen (0700, root)
      ansible.builtin.file:
        path: "{{ mirotalkbro_rtp_dev_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # --- Dev-Secrets generieren (idempotent: nur wenn absent) ----------------
    # Der Dev-Stream-Key ist bewusst Klartext: er IST die Credentials, die
    # ein Publisher zum Publizieren braucht. Alle Dateien 0600/root.

    - name: Dev-Secrets generieren (idempotent, atomar, ohne Newline)
      # argv-Form: bash -c erhält das Skript als EIN Argument — keine
      # Shell-Reinterpretation durch Ansible. Atomar via <datei>.tmp + mv,
      # umask 077 sorgt bereits bei der Erzeugung für 0600. printf %s
      # schreibt KEIN abschließendes Newline, damit Dateiinhalt und
      # Shell-$(cat …) byte-identisch sind (Hash- und Token-Vergleich).
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - >-
            umask 077;
            printf %s "$(openssl rand -hex 32)" > '{{ item }}.tmp'
            && mv '{{ item }}.tmp' '{{ item }}'
      args:
        creates: "{{ item }}"
      loop:
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/bro-ingest-secret.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/admin-token.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/api-key-secret.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key.txt"
      no_log: true

    - name: SHA-256-Hash des Dev-Stream-Keys erzeugen
      # Hasht EXAKT die Token-Bytes: printf %s und $(cat …) entfernen
      # sämtliche Newlines, sodass der Hash dem Token entspricht, das ffmpeg
      # als ?token=$(cat …) sendet — byte-identisch zur gerenderten keys.json.
      # Ergebnis newline-frei und atomar (tmp + mv) wie die Secrets selbst.
      # Bewusst OHNE creates-Guard: bei out-of-band neu generiertem Stream-Key
      # bleibt der Hash so garantiert konsistent zum Schlüssel.
      # changed_when false: deterministische Funktion der Schlüsseldatei.
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - >-
            umask 077;
            printf %s "$(printf %s "$(cat '{{ mirotalkbro_rtp_dev_secrets_dir
            }}/dev-stream-key.txt')"
            | sha256sum | cut -d' ' -f1)"
            > '{{ mirotalkbro_rtp_dev_secrets_dir
            }}/dev-stream-key-hash.txt.tmp'
            && mv '{{ mirotalkbro_rtp_dev_secrets_dir
            }}/dev-stream-key-hash.txt.tmp' '{{ mirotalkbro_rtp_dev_secrets_dir
            }}/dev-stream-key-hash.txt'
      changed_when: false
      no_log: true

    - name: Secret-Dateien strikt auf 0600/root setzen
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/bro-ingest-secret.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/admin-token.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/api-key-secret.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key.txt"
        - "{{ mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key-hash.txt"

    # --- Geheimnisse für Templates einlesen -----------------------------------
    # lookup('file', ...) läuft auf dem Controller; die Dateien liegen auf der
    # VM — deshalb slurp + set_fact.

    - name: Ingest-Secret einlesen
      ansible.builtin.slurp:
        src: "{{ mirotalkbro_rtp_dev_secrets_dir }}/bro-ingest-secret.txt"
      register: dev_slurp_bro_ingest_secret
      no_log: true

    - name: Admin-Token einlesen
      ansible.builtin.slurp:
        src: "{{ mirotalkbro_rtp_dev_secrets_dir }}/admin-token.txt"
      register: dev_slurp_admin_token
      no_log: true

    - name: API-Key-Secret einlesen
      ansible.builtin.slurp:
        src: "{{ mirotalkbro_rtp_dev_secrets_dir }}/api-key-secret.txt"
      register: dev_slurp_api_key_secret
      no_log: true

    - name: Stream-Key-Hash einlesen
      ansible.builtin.slurp:
        src: "{{ mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key-hash.txt"
      register: dev_slurp_stream_key_hash
      no_log: true

    - name: Gelesene Dev-Secrets als Fakten bereitstellen
      ansible.builtin.set_fact:
        mirotalkbro_rtp_dev_bro_ingest_secret: >-
          {{ dev_slurp_bro_ingest_secret.content | b64decode | trim }}
        mirotalkbro_rtp_dev_admin_token: >-
          {{ dev_slurp_admin_token.content | b64decode | trim }}
        mirotalkbro_rtp_dev_api_key_secret: >-
          {{ dev_slurp_api_key_secret.content | b64decode | trim }}
        mirotalkbro_rtp_dev_stream_key_hash: >-
          {{ dev_slurp_stream_key_hash.content | b64decode | trim }}
      no_log: true

    # --- Selbstsigniertes RTMPS-Dev-Zertifikat -------------------------------
    # Argv-Muster aus dem separaten (privaten) Produktions-Installer: echtes
    # End-Entity-Zertifikat (CA:FALSE + serverAuth-EKU), da strikte
    # TLS-Clients (rustls/webpki) sonst mit CaUsedAsEndEntity ablehnen.
    # no_log bewusst false: reines Dev-Zertifikat, Meldungen helfen bei
    # der Fehlersuche.

    - name: Selbstsigniertes RTMPS-Dev-Zertifikat erzeugen (nur wenn absent)
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -nodes
          - -newkey
          - rsa:4096
          # Dev-Zertifikat mit langer Gültigkeit (ausschließlich Entwicklung).
          - -days
          - "3650"
          - -keyout
          - "{{ mirotalkbro_rtp_dev_certs_dir }}/tls.key"
          - -out
          - "{{ mirotalkbro_rtp_dev_certs_dir }}/tls.crt"
          - -subj
          - "/CN={{ mirotalkbro_rtp_dev_domain }}"
          - -addext
          - subjectAltName=DNS:{{ mirotalkbro_rtp_dev_domain }}
          - -addext
          - basicConstraints=critical,CA:FALSE
          - -addext
          - keyUsage=critical,digitalSignature,keyEncipherment
          - -addext
          - extendedKeyUsage=serverAuth
        creates: "{{ mirotalkbro_rtp_dev_certs_dir }}/tls.crt"
      no_log: false

    - name: Zertifikatsdateien strikt auf 0600/root setzen
      ansible.builtin.file:
        path: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: "0600"
      loop:
        - "{{ mirotalkbro_rtp_dev_certs_dir }}/tls.crt"
        - "{{ mirotalkbro_rtp_dev_certs_dir }}/tls.key"

    # --- keys.json für den Dev-Stream-Key rendern ----------------------------

    - name: Keys.json für den Dev-Stream-Key rendern
      ansible.builtin.template:
        src: templates/dev-keys.json.j2
        dest: "{{ mirotalkbro_rtp_dev_config_dir }}/keys.json"
        owner: root
        group: root
        mode: "0644"

    # --- .env rendern ---------------------------------------------------------
    # Variablen entsprechen .env.example; Compose interpoliert daraus
    # BRO_INGEST_SECRET und die RTC-Ports, der bro-Container liest die Datei
    # zusätzlich read-only als App-Konfiguration.

    - name: Dev-.env rendern
      ansible.builtin.template:
        src: templates/dev-env.j2
        dest: "{{ mirotalkbro_rtp_project_dir }}/.env"
        owner: root
        group: root
        # 0644 bewusst: Der bro-Container läuft als USER node (1000:1000) und
        # liest die read-only gemountete /src/.env als uid 1000 — 0600/root
        # würde den App-Start brechen. Projektverzeichnis ist root-0755.
        mode: "0644"
      no_log: true

    # --- Compose-Stack bauen und starten -------------------------------------

    - name: Docker-Images bauen (docker compose build, mit Dev-Override)
      # Beide Compose-Dateien explizit: Die Basis-Datei bleibt loopback-only,
      # der Dev-Override addiert die Bindings am privaten Vagrant-Netz.
      # DEV_BIND_IP wird durchgereicht und steuert die Override-Bindings.
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ mirotalkbro_rtp_project_dir }}"
          - -f
          - "{{ mirotalkbro_rtp_project_dir }}/docker-compose.yml"
          - -f
          - "{{ mirotalkbro_rtp_project_dir }}/docker-compose.dev-override.yml"
          - build
        chdir: "{{ mirotalkbro_rtp_project_dir }}"
      environment:
        DEV_BIND_IP: "{{ mirotalkbro_rtp_dev_bind_ip }}"
      register: dev_compose_build
      # Build meldet auch bei reinem Cache-Treffer Aktivität; "changed" ist
      # hier bewusst grob (Dev-Wiederhollauf ist unproblematisch).
      changed_when: true

    - name: Compose-Stack starten (docker compose up -d, mit Dev-Override)
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ mirotalkbro_rtp_project_dir }}"
          - -f
          - "{{ mirotalkbro_rtp_project_dir }}/docker-compose.yml"
          - -f
          - "{{ mirotalkbro_rtp_project_dir }}/docker-compose.dev-override.yml"
          - up
          - -d
        chdir: "{{ mirotalkbro_rtp_project_dir }}"
      environment:
        DEV_BIND_IP: "{{ mirotalkbro_rtp_dev_bind_ip }}"
      register: dev_compose_up
      changed_when: >-
        'Started' in (dev_compose_up.stdout + dev_compose_up.stderr)
        or 'Created' in (dev_compose_up.stdout + dev_compose_up.stderr)
        or 'Recreated' in (dev_compose_up.stdout + dev_compose_up.stderr)
        or 'Pulling' in (dev_compose_up.stdout + dev_compose_up.stderr)
        or 'Removed' in (dev_compose_up.stdout + dev_compose_up.stderr)

    # --- Bereitschafts- und Funktionsprüfung ----------------------------------

    - name: Auf den BRO-Web-Port warten (VM-lokal, Loopback-Binding)
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ mirotalkbro_rtp_dev_port }}"
        timeout: 120

    - name: BRO-Startseite abrufen (Status nur informativ)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ mirotalkbro_rtp_dev_port }}/"
        status_code: [200, 301, 302]
      register: dev_bro_http_check
      failed_when: false

    # --- Ergebnis ausgeben ----------------------------------------------------

    - name: Dev-Zugang und Testkommandos ausgeben
      ansible.builtin.debug:
        msg:
          - >-
            Dev-Stack läuft (HTTP-Check:
            Status {{ dev_bro_http_check.status | default('n/a') }}).
          - ""
          - >-
            Zugriff (bewusst Plain-HTTP, nur Dev; über das private
            Vagrant-Netz gebunden — vom Host und aus der VM erreichbar):
          - >-
            Viewer für Broadcast {{ mirotalkbro_rtp_dev_broadcast_id }}:
            http://{{ mirotalkbro_rtp_dev_bind_ip }}:{{ mirotalkbro_rtp_dev_port
            }}/viewer?id={{ mirotalkbro_rtp_dev_broadcast_id }}&name=viewer
          - >-
            Broadcast-Seite (Browser-Quelle, alternative Prüfung):
            http://{{ mirotalkbro_rtp_dev_bind_ip }}:{{ mirotalkbro_rtp_dev_port
            }}/broadcast?id={{ mirotalkbro_rtp_dev_broadcast_id
            }}&name=broadcaster
          - ""
          - >-
            Test-Publish (RTMP-Endpunkt ebenfalls am privaten Vagrant-Netz —
            vom Host UND aus der VM nutzbar; die Key-Datei liegt auf der VM,
            vom Host also z. B. per `vagrant ssh` ausführen):
          - >-
            ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=30
            -f lavfi -i sine=frequency=440 -c:v libx264 -preset veryfast
            -tune zerolatency -pix_fmt yuv420p -c:a aac -ar 48000 -f flv
            'rtmp://{{ mirotalkbro_rtp_dev_bind_ip }}:19350/live/{{
            mirotalkbro_rtp_dev_broadcast_id }}?token=$(cat {{
            mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key.txt)'
          - ""
          - >-
            Hinweis RTMPS: Der öffentliche Ingest ist
            rtmps://{{ ansible_host }}:1935/live mit Stream-Key
            {{ mirotalkbro_rtp_dev_broadcast_id }}?token=<KEY>; das
            selbstsignierte Dev-Zertifikat muss in OBS manuell vertraut
            werden. Für Automatisierung daher :19350 (Plain-RTMP, per
            Dev-Override nur am privaten Vagrant-Netz gebunden) verwenden.
          - >-
            Dev-Stream-Key (Klartext, 0600/root):
            {{ mirotalkbro_rtp_dev_secrets_dir }}/dev-stream-key.txt —
            SHA-256-Hash: {{ mirotalkbro_rtp_dev_secrets_dir
            }}/dev-stream-key-hash.txt
